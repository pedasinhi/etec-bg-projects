<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora RGB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
<div id="youtube-background">
    <div id="youtube-player"></div>
</div>

<div id="video-overlay"></div>

<button type="button" id="music">♫ PLAY</button>

<main>
    <form id="calculator">

        <div class="inputs">
            <input
                type="text"
                id="num1"
                placeholder="Número 1"
                autocomplete="off"
            >

            <input
                type="text"
                id="num2"
                placeholder="Número 2"
                autocomplete="off"
            >
        </div>

        <div class="calculator-actions">
            <input
                type="text"
                id="resul"
                placeholder="Resultado"
                readonly
                aria-label="Resultado"
            >

            <div class="buttons">
                <button type="reset" id="clear">C</button>

                <button type="button" data-operacao="+">+</button>
                <button type="button" data-operacao="-">−</button>
                <button type="button" data-operacao="x">×</button>
                <button type="button" data-operacao=":">÷</button>
            </div>
        </div>

    </form>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="abdullJabbhar.js"></script>

</body>
</html>
